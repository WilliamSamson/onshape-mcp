[project]
name = "onshape-mcp"
version = "0.1.0"
description = "MCP server that drives the Onshape web UI — sketch, dimension, constrain and extrude from any MCP client."
keywords = ["mcp", "onshape", "cad", "model-context-protocol", "playwright", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Kayode Williams Olalere" },
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",  # TODO: migrate to MCPServer in M2
    "playwright>=1.48.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "Pillow>=10.4.0",
    "httpx>=0.27.0",
    "browser-cookie3>=0.20.1",
    "flask>=3.0.0",
    "gemini-webapi>=2.0.0",  # verify GeminiClient API on first install
]

[project.urls]
Homepage = "https://github.com/WilliamSamson/onshape-mcp"
Issues = "https://github.com/WilliamSamson/onshape-mcp/issues"

[project.scripts]
onshape-mcp = "onshape_mcp.server:main"
onshape-mcp-setup = "onshape_mcp.setup:main"
# Same thing as `onshape-mcp up`, available even before that hook lands.
onshape-mcp-up = "onshape_mcp.up:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -p no:launch_testing -p no:launch_ros"
