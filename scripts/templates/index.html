<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>onshape-mcp · gemini client</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #0e1014; color: #e7e9ee; height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 12px 20px; border-bottom: 1px solid #1f232b; display: flex; gap: 12px; align-items: center; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #6dd06d; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { color: #7d8590; font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .col { padding: 16px 20px; overflow-y: auto; }
  .col.right { background: #14171d; border-left: 1px solid #1f232b; display: flex; flex-direction: column; }
  .step {
    margin-bottom: 12px; padding: 10px 12px; border-radius: 8px;
    background: #181c22; border: 1px solid #232830; font-size: 13px;
  }
  .step .head { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .step .head .n { color: #7d8590; font-weight: 400; }
  .step.ok { border-color: #2a4730; }
  .step.err { border-color: #5a2a2a; background: #20181a; }
  .step pre { margin: 8px 0 0 0; font-size: 12px; color: #b6bcc7; white-space: pre-wrap; word-break: break-all; }
  .summary { padding: 12px 14px; border-radius: 8px; background: #14291a; border: 1px solid #2a4730; color: #b3e5b3; margin-bottom: 12px; font-size: 13px; }
  .summary.fail { background: #291414; border-color: #5a2a2a; color: #e5b3b3; }
  form {
    display: flex; gap: 8px; padding: 12px 20px;
    border-top: 1px solid #1f232b; background: #0e1014;
  }
  input[type=text] {
    flex: 1; padding: 10px 14px; border-radius: 8px;
    background: #181c22; color: #e7e9ee; border: 1px solid #232830;
    font-family: inherit; font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: #3a5fff; }
  button {
    padding: 10px 18px; border-radius: 8px; background: #3a5fff;
    color: white; border: none; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .shot-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .shot-wrap img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  .placeholder { color: #7d8590; font-size: 13px; text-align: center; }
  .err-inline { color: #e57373; font-size: 12px; margin-top: 6px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #7d8590; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>onshape-mcp</h1>
  <span class="sub">gemini web · vision + reasoning · 14 wired tools</span>
</header>
<main>
  <section class="col left">
    <div id="transcript">
      <div class="placeholder">type a goal below to start. e.g. "create a 5x5mm cube on the top plane".</div>
    </div>
  </section>
  <section class="col right">
    <div class="shot-wrap" id="shot-wrap">
      <div class="placeholder">live viewport screenshot will appear here</div>
    </div>
  </section>
</main>
<form id="form">
  <input type="text" id="goal" placeholder="create a 5x5mm square and extrude it 5mm into a cube" autocomplete="off" autofocus>
  <button id="send" type="submit">send</button>
</form>
<script>
const transcript = document.getElementById("transcript");
const shotWrap = document.getElementById("shot-wrap");
const form = document.getElementById("form");
const goalInput = document.getElementById("goal");
const sendBtn = document.getElementById("send");

function clear() { transcript.innerHTML = ""; }

function addStep(step) {
  const div = document.createElement("div");
  div.className = "step " + (step.ok ? "ok" : "err");
  const head = document.createElement("div");
  head.className = "head";
  if (step.tool) {
    head.innerHTML = `<span>${escapeHtml(step.tool)}</span><span class="n">step ${step.step} · ${step.elapsed_s}s</span>`;
  } else if (step.error) {
    head.innerHTML = `<span>error</span><span class="n">step ${step.step}</span>`;
  }
  div.appendChild(head);
  if (step.args && Object.keys(step.args).length) {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(step.args, null, 2);
    div.appendChild(pre);
  }
  if (step.error) {
    const e = document.createElement("div");
    e.className = "err-inline";
    e.textContent = step.error;
    div.appendChild(e);
  }
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function addSummary(r) {
  const div = document.createElement("div");
  div.className = "summary " + (r.completed ? "" : "fail");
  div.textContent = r.completed ? `done: ${r.summary}` : `stopped: ${r.summary}`;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function setShot(path) {
  if (!path) {
    shotWrap.innerHTML = '<div class="placeholder">live viewport screenshot will appear here</div>';
    return;
  }
  // Bust cache with a timestamp so each step shows a fresh image.
  const url = `/state/${encodeURIComponent(path.split("/").pop())}?t=${Date.now()}`;
  shotWrap.innerHTML = `<img src="${url}" alt="screenshot">`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const goal = goalInput.value.trim();
  if (!goal) return;
  clear();
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span> working';
  // Show the goal at the top of the transcript.
  const goalDiv = document.createElement("div");
  goalDiv.className = "summary";
  goalDiv.textContent = "goal: " + goal;
  transcript.appendChild(goalDiv);

  try {
    const res = await fetch("/act", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal }),
    });
    const data = await res.json();
    if (!res.ok) {
      addStep({ step: "?", ok: false, error: data.error || "request failed" });
      return;
    }
    for (const s of data.steps) addStep(s);
    addSummary(data);
    setShot(data.final_screenshot);
  } catch (err) {
    addStep({ step: "?", ok: false, error: String(err) });
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "send";
    goalInput.value = "";
    goalInput.focus();
  }
});
</script>
</body>
</html>
